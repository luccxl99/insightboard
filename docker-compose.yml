services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insightboard
      POSTGRES_USER: insightboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-insightboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightboard -d insightboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/insightboard
      DB_USER: insightboard
      DB_PASSWORD: ${DB_PASSWORD:-insightboard}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-0123456789}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
